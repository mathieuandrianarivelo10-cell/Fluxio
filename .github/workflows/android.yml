name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make Gradle Wrapper executable
      run: |
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          echo "gradle-wrapper.jar not found, generating wrapper..."
          gradle wrapper --gradle-version 8.7
        fi
        chmod +x gradlew

    - name: Create environment files (.env & .env.template)
      run: |
        cat << 'EOF' > .env.template
        FIREBASE_WEB_CLIENT_ID="577398237015-sgrt2thd7n2oku71ermqn8tll2ncl5m5.apps.googleusercontent.com"
        ADMIN_EMAIL_1="rmihaja44@gmail.com"
        ADMIN_EMAIL_2="mathieuandrianarivelo10@gmail.com"
        ADMIN_PASSWORD="mihaja29"
        EOF

        CLIENT_ID="${{ secrets.FIREBASE_WEB_CLIENT_ID }}"
        ADMIN1="${{ secrets.ADMIN_EMAIL_1 }}"
        ADMIN2="${{ secrets.ADMIN_EMAIL_2 }}"
        ADMIN_PASS="${{ secrets.ADMIN_PASSWORD }}"

        cat << EOF > .env
        FIREBASE_WEB_CLIENT_ID="${CLIENT_ID:-577398237015-sgrt2thd7n2oku71ermqn8tll2ncl5m5.apps.googleusercontent.com}"
        ADMIN_EMAIL_1="${ADMIN1:-rmihaja44@gmail.com}"
        ADMIN_EMAIL_2="${ADMIN2:-mathieuandrianarivelo10@gmail.com}"
        ADMIN_PASSWORD="${ADMIN_PASS:-mihaja29}"
        EOF

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7

